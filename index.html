<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BH Cabines - Dashboard de Ativos T.I & Rede</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col">
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-col md:flex-row justify-between items-center shadow-lg gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-slate-800 p-1.5 rounded-lg flex items-center justify-center h-12 w-auto min-w-[48px] overflow-hidden border border-slate-700">
        <img src="logo.png" alt="BH Cabines" class="max-h-full w-auto object-contain" onerror="this.onerror=null; this.src='';" />
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-wide">BH CABINES</h1>
        <p class="text-xs text-slate-400">Monitoramento Integrado de Ativos (Zabbix & LibreNMS)</p>
      </div>
    </div>
    <div class="flex items-center gap-4 text-sm">
      <div class="bg-slate-700/50 px-3 py-1.5 rounded-md border border-slate-600">
        <span class="text-slate-400">Última Atualização:</span>
        <strong id="last-update" class="text-blue-400">Carregando...</strong>
      </div>
      <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-md text-sm flex items-center transition-colors">
         <i class="fa-solid fa-rotate-right mr-1"></i> Atualizar
      </button>
    </div>
  </header>

  <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
    <!-- Seção de Contadores Detalhados por Tipo de Dispositivo -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <!-- Card Servidores -->
      <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 flex items-center justify-between shadow-md">
        <div>
          <p class="text-slate-400 text-sm">Servidores</p>
          <h4 id="count-servers" class="text-2xl font-bold text-white">0</h4>
        </div>
        <div class="p-3 bg-blue-500/10 text-blue-400 rounded-md">
          <i class="fa-solid fa-server text-xl"></i>
        </div>
      </div>

      <!-- Card Estações de Trabalho -->
      <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 flex items-center justify-between shadow-md">
        <div>
          <p class="text-slate-400 text-sm">Estações de Trabalho</p>
          <h4 id="count-workstations" class="text-2xl font-bold text-white">0</h4>
        </div>
        <div class="p-3 bg-green-500/10 text-green-400 rounded-md">
          <i class="fa-solid fa-desktop text-xl"></i>
        </div>
      </div>

      <!-- Card Impressoras -->
      <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 flex items-center justify-between shadow-md">
        <div>
          <p class="text-slate-400 text-sm">Impressoras</p>
          <h4 id="count-printers" class="text-2xl font-bold text-white">0</h4>
        </div>
        <div class="p-3 bg-yellow-500/10 text-yellow-400 rounded-md">
          <i class="fa-solid fa-print text-xl"></i>
        </div>
      </div>

      <!-- Card Outros Dispositivos -->
      <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 flex items-center justify-between shadow-md">
        <div>
          <p class="text-slate-400 text-sm">Outros Dispositivos</p>
          <h4 id="count-others" class="text-2xl font-bold text-white">0</h4>
        </div>
        <div class="p-3 bg-purple-500/10 text-purple-400 rounded-md">
          <i class="fa-solid fa-network-wired text-xl"></i>
        </div>
      </div>
    </div>

    <!-- Demais blocos originais da sua dashboard continuam aqui -->
  </main>

  <script>
    async function carregarContadores() {
        try {
            // Busca o arquivo JSON gerado pelo export_metrics.py (com parâmetro anti-cache)
            const response = await fetch('bh_cabines_assets.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error('Erro ao carregar os dados');
            
            const data = await response.json();
            
            // Preenche os contadores de dispositivos nos cards
            document.getElementById('count-servers').innerText = data.servers || 0;
            document.getElementById('count-workstations').innerText = data.workstations || 0;
            document.getElementById('count-printers').innerText = data.printers || 0;
            document.getElementById('count-others').innerText = data.others || 0;
            
            // Atualiza a última atualização com a data/hora vinda do script Python
            if (data.last_update) {
                document.getElementById('last-update').innerText = data.last_update;
            }
        } catch (error) {
            console.error("Não foi possível carregar os contadores:", error);
        }
    }

    // Executa a função assim que a página carrega
    carregarContadores();
  </script>    

<!-- Fim dos cards e blocos da dashboard -->
  </main>

  <!-- Rodapé da Página -->
  <footer class="mt-8 py-4 text-center text-slate-500 text-sm border-t border-slate-800">
    BH Cabines - Painel de Monitoramento Integrado &copy; 2026
  </footer>

  <!-- Script de Atualização dos Dados -->
  <script>
    async function carregarContadores() {
        try {
            const response = await fetch('bh_cabines_assets.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error('Erro ao carregar o JSON');
            
            const data = await response.json();
            
            document.getElementById('count-servers').innerText = data.servers || 0;
            document.getElementById('count-workstations').innerText = data.workstations || 0;
            document.getElementById('count-printers').innerText = data.printers || 0;
            document.getElementById('count-others').innerText = data.others || 0;
            
            if (data.last_update) {
                document.getElementById('last-update').innerText = data.last_update;
            }
        } catch (error) {
            console.error("Erro ao carregar contadores:", error);
        }
    }
    carregarContadores();
  </script>
</body>
</html>
